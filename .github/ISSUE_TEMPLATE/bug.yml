name: Bug
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, compose vs uv, model name. No secrets.
    validations:
      required: true
